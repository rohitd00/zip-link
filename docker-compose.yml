services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ziplink-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://url_shortener_app:local_dev_password_change_me@postgres:5432/url_shortener_dev
      REDIS_URL: redis://redis:6379
      IP_HASH_SECRET: ${IP_HASH_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_VALUE}
      IP_HASH_KEY_VERSION: v1
      OWNER_COOKIE_SECRET: ${OWNER_COOKIE_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_VALUE}
      REDIRECT_CACHE_TTL_SECONDS: 86400
      CREATE_RATE_LIMIT_MAX_REQUESTS: 20
      CREATE_RATE_LIMIT_WINDOW_SECONDS: 900
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ziplink-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://url_shortener_app:local_dev_password_change_me@postgres:5432/url_shortener_dev
      REDIS_URL: redis://redis:6379
      IP_HASH_SECRET: ${IP_HASH_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_VALUE}
      IP_HASH_KEY_VERSION: v1
      ANALYTICS_WORKER_CONCURRENCY: 10
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ziplink-web
    ports:
      - "8080:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: ziplink-postgres
    environment:
      POSTGRES_USER: url_shortener_app
      POSTGRES_PASSWORD: local_dev_password_change_me
      POSTGRES_DB: url_shortener_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortener_app -d url_shortener_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ziplink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
