# Serves the built React dashboard and proxies the same two path prefixes
# the local Vite dev server proxies (see apps/web/vite.config.mts), so the
# browser only ever talks to one origin in both environments.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    location /health/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    # A client-side route like /links/abc123 has no matching static file;
    # fall back to index.html so React Router can render it.
    location / {
        try_files $uri /index.html;
    }
}
